<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>VARI - ĆACILEND</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one centred column. HUD strip, pixel-art stage with overlay, touch pad, hint line. Single dark look on purpose; the sky is the star. */
:root{
  --bg:#12152a;
  --panel:#1c2140;
  --fg:#f1f3ff;
  --muted:#9aa3d6;
  --accent:#ffcf3a;
  --sky:#6fe3ff;
  --font-display:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font-body);
  padding-block:20px;box-sizing:border-box;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.game{position:relative;z-index:1;width:min(1500px,100%,max(320px,calc((100vh - 250px)*1.818)));display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--font-display);font-size:clamp(14px,2.2vw,28px);color:var(--accent);margin:0;line-height:1.4;text-wrap:balance;background:rgba(18,21,42,.8);padding:8px 14px;border-radius:6px;align-self:flex-start}
.hud{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--panel);border-radius:6px;font-family:var(--font-display);font-size:clamp(10px,1.2vw,16px);line-height:1.4}
.hud b{color:var(--accent);font-weight:400;font-variant-numeric:tabular-nums}
.hud button{font-family:var(--font-display);font-size:9px;color:var(--fg);background:transparent;border:2px solid var(--muted);border-radius:4px;padding:6px 8px;cursor:pointer}
.hud button:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{position:relative;width:100%;aspect-ratio:320/176;background:var(--sky);border:4px solid #000;border-radius:4px;overflow:hidden;outline:none;box-shadow:0 0 0 3px rgba(255,207,58,.35),0 12px 60px rgba(0,0,0,.6)}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vw,18px);text-align:center;background:rgba(10,14,40,.6);font-family:var(--font-display);padding:12px;cursor:pointer}
.overlay h2{margin:0;font-size:clamp(14px,4.2vw,56px);color:var(--accent);text-shadow:3px 3px 0 #000;line-height:1.3}
.overlay p{margin:0;font-size:clamp(7px,1.7vw,20px);line-height:1.9;color:var(--fg);text-shadow:1px 1px 0 #000}
.overlay p.small{color:var(--muted)}
.pad{display:flex;justify-content:space-between;gap:12px}
.pad .dir{display:flex;gap:12px}
.btn{min-width:76px;height:60px;padding:0 14px;border-radius:8px;border:2px solid #000;background:var(--panel);color:var(--fg);font-family:var(--font-display);font-size:14px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.btn.on{background:var(--accent);color:#000}
.bgtext{position:fixed;left:50%;top:50%;z-index:0;width:max-content;transform:translate(-50%,-50%) rotate(-12deg);pointer-events:none;user-select:none;white-space:pre;font-family:var(--font-display);font-size:clamp(16px,2.4vw,30px);line-height:2.6;color:transparent;background:linear-gradient(105deg,rgba(154,163,214,.13) 0%,rgba(154,163,214,.13) 36%,rgba(255,236,150,.95) 50%,rgba(154,163,214,.13) 64%,rgba(154,163,214,.13) 100%) 0 0/900px 900px repeat;-webkit-background-clip:text;background-clip:text;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:900px 0}}
@media (prefers-reduced-motion:reduce){.bgtext{animation:none}}
.hint{margin:0;color:var(--muted);font-size:13px;line-height:1.6;max-width:65ch;background:rgba(18,21,42,.8);padding:8px 12px;border-radius:6px}
</style>

  <h1>VARI - ĆACILEND</h1>
  <div class="hud">
    <span>POENI <b id="score">000000</b></span>
    <span>SENDVIČI <b id="coins">00</b></span>
    <span>DINARI <b id="din">0</b></span>
    <span>ŽIVOTI <b id="lives">3</b></span>
    <button id="mute" type="button">ZVUK: DA</button>
  </div>
  <div class="stage" id="stage" tabindex="0">
    <canvas id="c" width="320" height="176" aria-label="Igra"></canvas>
    <div class="overlay" id="ov"></div>
  </div>
  <div class="pad">
    <div class="dir">
      <button class="btn" type="button" data-key="left" aria-label="Levo">◀</button>
      <button class="btn" type="button" data-key="right" aria-label="Desno">▶</button>
    </div>
    <div class="dir">
      <button class="btn" type="button" data-key="run">TRČI</button>
      <button class="btn" type="button" data-key="jump">SKOK</button>
    </div>
  </div>
  <p class="hint">Cilj je zastava na kraju nivoa. Gazi neprijatelje odozgo, preskači rupe, skupljaj sendviče i pare od 2000 dinara i udaraj žute blokove odozdo. Ako tastatura ne reaguje, klikni jednom na igru.</p>
</main>

/* ---------- state ---------- */
let state='title',frame=0,camX=0,score=0,coinCount=0,lives=3,checkpoint=0,deadT=0,winT=0,idleT=0;

function updateHud(){
  $('score').textContent=String(score).padStart(6,'0');

  $('lives').textContent='♥'.repeat(Math.max(0,lives))||'0';

}

  enemies=ENEMY_TILES.map((c,i)=>({x:c*T+3,y:GROUND*T-30,w:10,h:30,type:i%2,vx:-0.45,vy:0,sq:0,alive:true,t:0}));

/* ---------- audio ---------- */
let ac=null,muted=false;
function initAudio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function tone(f1,f2,dur,type,vol){
  if(!ac||muted)return;
  try{
    const t=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(gn);gn.connect(ac.destination);o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}

/* ---------- physics ---------- */
function solidAt(c,r){
  if(c<0||c>=LW)return true;
  if(r<0||r>=ROWS)return false;
  return tiles[r][c]!==0;
}
function hitBlock(c,r){
  const t=tiles[r][c];
  if(t===3){
    tiles[r][c]=4;const k=(c>>1)&1;if(k)dinars+=2000;else coinCount++;score+=100;updateHud();
    pops.push({x:c*T+8,y:r*T-4,t:0,k});sfx.coin();
    bumps.push({c,r,t:0});
  }else if(t===2){
    bumps.push({c,r,t:0});sfx.bump();
  }
}
function moveX(){
  P.x+=P.vx;
  const top=Math.floor(P.y/T),bot=Math.floor((P.y+P.h-0.01)/T);
  if(P.vx>0){
    const c=Math.floor((P.x+P.w)/T);
    for(let r=top;r<=bot;r++)if(solidAt(c,r)){P.x=c*T-P.w;P.vx=0;break;}
  }else if(P.vx<0){
    const c=Math.floor(P.x/T);
    for(let r=top;r<=bot;r++)if(solidAt(c,r)){P.x=(c+1)*T;P.vx=0;break;}
  }
}
function moveY(){
  P.y+=P.vy;P.onGround=false;
  const l=Math.floor(P.x/T),r2=Math.floor((P.x+P.w-0.01)/T);
  if(P.vy>0){
    const r=Math.floor((P.y+P.h)/T);
    for(let c=l;c<=r2;c++)if(solidAt(c,r)){P.y=r*T-P.h;P.vy=0;P.onGround=true;break;}
  }else if(P.vy<0){
    const r=Math.floor(P.y/T);
    let best=-1,bd=1e9;
    for(let c=l;c<=r2;c++)if(solidAt(c,r)){
      const d=Math.abs(c*T+8-(P.x+P.w/2));
      if(d<bd){bd=d;best=c;}
    }
    if(best>=0){P.y=(r+1)*T;P.vy=0;hitBlock(best,r);}
  }
}
function stepPlayer(){
  const dir=(keys.right?1:0)-(keys.left?1:0);
  const maxV=keys.run?2.2:1.5;
  const acc=P.onGround?0.2:0.12;
  const target=dir*maxV;
  if(P.vx<target)P.vx=Math.min(P.vx+acc,target);
  else if(P.vx>target)P.vx=Math.max(P.vx-acc,target);
  if(dir)P.face=dir;

  P.buffer=Math.max(0,P.buffer-1);
  if(keys.jumpEdge){P.buffer=6;keys.jumpEdge=false;}
  P.coyote=P.onGround?6:Math.max(0,P.coyote-1);
  if(P.buffer>0&&P.coyote>0){P.vy=-6.9;P.buffer=0;P.coyote=0;P.onGround=false;sfx.jump();}
  if(!keys.jump&&P.vy<-2.2)P.vy=-2.2;
  P.vy=Math.min(P.vy+0.32,7);

  moveX();moveY();
  P.ph=(P.ph||0)+(P.onGround?Math.abs(P.vx)*0.2:0);
  if(P.x<camX){P.x=camX;P.vx=0;}
  for(const cp of[153,128,104,84,56])if(P.x>cp*T){checkpoint=cp*T+8;break;}
  if(P.y>H+10)die();
}
function stepEnemies(){
  for(const e of enemies){
    if(!e.alive)continue;
    if(e.sq>0){e.sq--;if(e.sq===0)e.alive=false;continue;}
    if(e.x>camX+W+40)continue;
    if(e.x<camX-80){e.alive=false;continue;}
    e.t++;
    e.x+=e.vx;
    const lead=e.vx<0?e.x:e.x+e.w,c=Math.floor(lead/T);
    const r0=Math.floor(e.y/T),r1=Math.floor((e.y+e.h-0.01)/T);
    let hit=false;
    for(let r=r0;r<=r1;r++)if(solidAt(c,r))hit=true;
    if(hit){e.vx=-e.vx;e.x+=e.vx*2;}
    e.vy=Math.min(e.vy+0.3,6);e.y+=e.vy;
    const cc=Math.floor((e.x+e.w/2)/T),rr=Math.floor((e.y+e.h)/T);
    if(e.vy>=0&&solidAt(cc,rr)){e.y=rr*T-e.h;e.vy=0;}
    if(e.y>H+30){e.alive=false;continue;}
    if(state==='play'&&P.x<e.x+e.w&&P.x+P.w>e.x&&P.y<e.y+e.h&&P.y+P.h>e.y){
      const prevBottom=P.y+P.h-P.vy;
      if(P.vy>0&&prevBottom<=e.y+5){
        e.sq=28;P.vy=keys.jump?-6:-4;score+=100;updateHud();sfx.stomp();
      }else if(P.y+P.h>e.y+6)die();
    }
  }
}
function checkCoins(){
  for(const c of coins){
    if(c.got)continue;
    if(P.x<c.x+12&&P.x+P.w>c.x-12&&P.y<c.y+7&&P.y+P.h>c.y-7){
      c.got=true;if(c.k)dinars+=2000;else coinCount++;score+=50;updateHud();sfx.coin();
    }
  }
}
function updateCam(){
  const target=Math.max(0,Math.min(LW*T-W,P.x+5-W*0.4));
  if(target>camX)camX=target;
}
function step(){
  frame++;
  for(const b of bumps)b.t++;
  bumps=bumps.filter(b=>b.t<10);
  for(const p of pops){p.t++;p.y-=1.2;}
  pops=pops.filter(p=>p.t<30);
  if(state==='play'){
    stepPlayer();
    if(state==='play'){
      stepEnemies();checkCoins();
      if(P.x+P.w>FLAGX)win();
    }
  }else if(state==='dead'){
    deadT++;P.vy=Math.min(P.vy+0.3,7);P.y+=P.vy;
    if(deadT>100)afterDeath();
  }else if(state==='win'){
    winT++;
    P.vy=Math.min(P.vy+0.32,7);moveY();
    if(winT===50)showOverlay('BRAVO!',[['Stigao si do zastave'],['Poeni: '+score],['Dodirni ekran ili pritisni taster za novu igru',1]]);
  }else{
    idleT++;
  }
  if(state==='play'||state==='win')updateCam();
}

/* ---------- drawing ---------- */
function disc(cx,cy,r,col){
  g.fillStyle=col;
  for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy)+0.5);g.fillRect(cx-w,cy+dy,w*2+1,1);}
}
function cloud(x,y,n){
  const pts=[];
  for(let i=0;i<n;i++){
    const mid=i>0&&i<n-1;
    pts.push([x+9+i*11,y+(mid?5:9),mid?9:7]);
  }
  for(const [a,b,r] of pts)disc(a,b,r+1,'#2f78c0');
  for(const [a,b,r] of pts)disc(a,b,r,'#ffffff');
  g.fillStyle='#c4f1ff';
  g.fillRect(x+4,y+14,n*11+4,2);
}
function hill(x,r){
  disc(x,GROUND*T,r+1,'#0f6a2a');
  disc(x,GROUND*T,r,'#35c24a');
  disc(x-Math.floor(r/3),GROUND*T-Math.floor(r/2),Math.floor(r/4),'#6ff07e');
}
function bush(x){
  const y=GROUND*T-4;
  for(const dx of[-8,0,8])disc(x+dx,y,8,'#0f6a2a');
  for(const dx of[-8,0,8])disc(x+dx,y,7,'#4fd05a');
}
const CLOUDS=[];
for(let i=0;i<30;i++)CLOUDS.push({x:i*130+(i%3)*30+20,y:14+((i*37)%46),n:2+(i%2)});
const HILLS=[[24,22],[58,24],[88,26],[118,24],[140,22],[170,26],[192,22]];
const BUSHES=[20,31,50,61,79,86,91,100,112,125,135,148,158,168,180,185];
const BUILD_TILES=[10,40,72,100,130,160,188];
const TENT_TILES=[26,56,86,118,148,178],PARK_TILES=[50,108,168];

let PARTS=null;
function buildParts(im){
  const cut=(sx,sy,w,h)=>mk(w,h,c=>c.drawImage(im,sx,sy,w,h,0,0,w,h));
  PARTS={
    body:mk(28,36,c=>{c.drawImage(im,0,0);c.clearRect(21,0,7,7);c.clearRect(0,24,28,12);c.fillStyle='#0e0a14';c.fillRect(14,16,5,4);}),
    tL:cut(0,21,16,8),sL:cut(0,29,16,7),tR:cut(16,21,12,8),sR:cut(16,29,12,7),arm:cut(21,0,7,7),arm2:cut(14,9,5,11)
  };
}
function leg(t,sh,hx,hy,ox,kx,sx,a,kb){
  g.save();g.translate(hx,hy);g.rotate(a);g.drawImage(t,-ox,-1);
  g.translate(kx,6);g.rotate(kb);g.drawImage(sh,sx,1);g.restore();
}
function drawPlayer(){
  const im=IMG.player;
  const x=Math.round(P.x+P.w/2-PW/2-camX);
  const y=Math.round(P.y+P.h-PH);
  if(!ready(im)){g.fillStyle='#222';g.fillRect(Math.round(P.x-camX),Math.round(P.y),P.w,P.h);return;}
  if(!PARTS)buildParts(im);
  const air=!P.onGround,mv=state==='play'&&!air&&Math.abs(P.vx)>0.3;
  const ph=P.ph||0,s=Math.sin(ph),co=Math.cos(ph);
  let la=0,ra=0,kl=0,kr=0,ll=0,rl=0,bob=0,aa=Math.sin(frame/20)*0.12,a2=-Math.sin(frame/20)*0.1,lean=0;
  if(air){la=-0.5;ra=0.6;kl=0.9;kr=0.3;ll=2;aa=-0.9;a2=0.7;lean=0.06;}
  else if(mv){
    const f=Math.min(1,Math.abs(P.vx)/1.5),fl=Math.max(0,-co),fr=Math.max(0,co);
    la=s*0.5*f;ra=-la;kl=(0.1+fl)*f;kr=(0.1+fr)*f;ll=fl*2*f;rl=fr*2*f;
    bob=-Math.round(Math.abs(co)*2*f);aa=-0.2-s*0.9*f;a2=0.2+s*0.9*f;lean=0.07+0.07*f+0.035*s*f;
  }
  g.save();
  if(P.face<0){g.translate(x+PW,y+bob);g.scale(-1,1);}else g.translate(x,y+bob);
  leg(PARTS.tL,PARTS.sL,12,22-ll,12,-4,-8,la,kl);
  leg(PARTS.tR,PARTS.sR,20,22-rl,4,3,-7,ra,kr);
  g.translate(14,24);g.rotate(lean);
  g.drawImage(PARTS.body,-14,-24);
  g.save();g.translate(2,-15);g.rotate(a2);g.drawImage(PARTS.arm2,-2,0);g.restore();
  g.translate(7,-17);g.rotate(aa);g.drawImage(PARTS.arm,0,-7);
  g.restore();
}
function drawEnemy(e,cx){
  const im=e.type?IMG.e2:IMG.e1;
  if(!ready(im)){g.fillStyle='#333';g.fillRect(Math.round(e.x-cx),Math.round(e.y),e.w,e.h);return;}
  const w=im.naturalWidth,h=im.naturalHeight;
  const x=Math.round(e.x+e.w/2-w/2-cx);
  const squash=e.sq>0;
  const dh=squash?5:h;
  const y=Math.round(e.y+e.h-dh)+(!squash&&Math.floor(e.t/8)%2?-1:0);
  if(e.vx>0){g.save();g.translate(x+w,y);g.scale(-1,1);g.drawImage(im,0,0,w,dh);g.restore();}
  else g.drawImage(im,x,y,w,dh);
}
function drawBuilding(bx){
  const by=GROUND*T-BH;
  if(ready(IMG.building))g.drawImage(IMG.building,bx,by);
  const px=bx+FIN_X,py=by+3;
  g.fillStyle='#b8bfd4';g.fillRect(px,py-26,1,27);
  g.fillStyle='#ffcf3a';g.fillRect(px-1,py-28,3,2);
  for(let i=0;i<24;i++){
    const off=Math.round(Math.sin(frame/8+i*0.5)*Math.min(2,i/6));
    g.drawImage(FLAG,i*S,0,S,15*S,px+1+i,py-26+off,1,15);
  }
}
function drawCoin(c,cx){drawPick(c.k,c.x-cx,c.y+Math.sin(frame/14+c.ph)*2,frame/9+c.ph*1.3);}
function drawFlag(cx){
  const x=FLAGX-cx;
  if(x<-40||x>W+40)return;
  g.fillStyle='#4a5070';g.fillRect(x-3,GROUND*T-4,8,4);
  g.fillStyle='#000';g.fillRect(x-1,40,4,GROUND*T-42);
  g.fillStyle='#e8eaf5';g.fillRect(x,40,2,GROUND*T-44);
  disc(x+1,38,3,'#7a4d0a');disc(x+1,38,2,'#ffcf3a');
  const top=P&&state==='win'?Math.max(46,Math.min(P.y,120)):46;
  for(let i=0;i<12;i++){
    g.fillStyle=i<2?'#ff8a8a':'#ff5d5d';
    g.fillRect(x+2,top+i,Math.max(1,14-i),1);
  }
}
function render(){
  g.setTransform(S,0,0,S,0,0);
  ['#4cc8f5','#5fd2f8','#74dbfa','#8ae3fc','#a1eafd','#b8f0fe','#c4f1ff','#c4f1ff'].forEach((c,i)=>{g.fillStyle=c;g.fillRect(0,i*22,W,22);});
  const cx=Math.round(camX);
  for(const cl of CLOUDS){
    const x=Math.round(cl.x-camX*0.5);
    if(x>-50&&x<W+10)cloud(x,cl.y,cl.n);
  }
  for(const [t,r] of HILLS){const x=t*T-cx;if(x>-60&&x<W+60)hill(x,r);}
  for(const t of BUSHES){const x=t*T-cx;if(x>-40&&x<W+40)bush(x);}
  for(const t of BUILD_TILES){const bx=Math.round(t*T-BW/2-cx);if(bx<W&&bx+BW>0)drawBuilding(bx);}
  for(const t of PARK_TILES){const x=Math.round(t*T-56-cx);if(x<W&&x+112>0)g.drawImage(PARK,x,GROUND*T-44);}
  TENT_TILES.forEach((t,i)=>{const x=Math.round(t*T-32-cx);if(x<W&&x+64>0)g.drawImage(i%2?TENT2:TENT1,x,GROUND*T-52);});

  const c0=Math.max(0,Math.floor(cx/T)),c1=Math.min(LW-1,Math.floor((cx+W)/T));
  for(let r=0;r<ROWS;r++)for(let c=c0;c<=c1;c++){
    const t=tiles[r][c];
    if(!t)continue;
    let img;
    if(t===1)img=(r>0&&solidAt(c,r-1))?TILE.ground:TILE.gtop;
    else if(t===2)img=TILE.brick;
    else if(t===3)img=TILE.q;
    else if(t===4)img=TILE.used;
    else{
      const top=!(r>0&&tiles[r-1][c]===5),left=!(c>0&&tiles[r][c-1]===5);
      img=TILE['p'+(top?'T':'B')+(left?'L':'R')];
    }
    let by=0;
    if(bumps.length){
      const b=bumps.find(b=>b.c===c&&b.r===r);
      if(b)by=-Math.round(Math.sin(b.t/10*Math.PI)*5);
    }
    g.drawImage(img,c*T-cx,r*T+by);
  }
  for(const c of coins)if(!c.got&&c.x-cx>-10&&c.x-cx<W+10)drawCoin(c,cx);
  for(const e of enemies){
    if(!e.alive)continue;
    const x=Math.round(e.x-cx),y=Math.round(e.y);
    if(x<-20||x>W+20)continue;
    drawEnemy(e,cx);
  }
  drawFlag(cx);
  drawPlayer();
  for(const p of pops)drawPick(p.k,p.x-cx,p.y,p.t/3);
}

/* ---------- input ---------- */
function poke(){
  initAudio();
  if(state==='title'||((state==='over'||state==='win')&&idleT>45))startGame();
}
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',ShiftLeft:'run',ShiftRight:'run',KeyX:'run'};
window.addEventListener('keydown',e=>{
  const k=KEYMAP[e.code];
  if(k){
    e.preventDefault();
    if(k==='jump'&&!e.repeat)keys.jumpEdge=true;
    keys[k]=true;poke();
  }else if(e.code==='Enter'){poke();}
  else if(e.code==='KeyM'){toggleMute();}
});
window.addEventListener('keyup',e=>{
  const k=KEYMAP[e.code];
  if(k){e.preventDefault();keys[k]=false;}
});
window.addEventListener('blur',()=>{keys.left=keys.right=keys.jump=keys.run=false;});
stage.addEventListener('pointerdown',()=>{stage.focus({preventScroll:true});poke();});
document.querySelectorAll('.btn').forEach(b=>{
  const k=b.dataset.key;
  b.addEventListener('contextmenu',e=>e.preventDefault());
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    try{b.setPointerCapture(e.pointerId);}catch(err){}
    if(k==='jump')keys.jumpEdge=true;
    keys[k]=true;b.classList.add('on');poke();
  });
  const up=()=>{keys[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up);
  b.addEventListener('lostpointercapture',up);
});
function toggleMute(){
  muted=!muted;
  $('mute').textContent='ZVUK: '+(muted?'NE':'DA');
}
$('mute').addEventListener('click',toggleMute);

/* ---------- boot ---------- */
buildLevel();respawn();updateHud();
showOverlay('VARI - ĆACILEND',[
  ['Dodirni ekran ili pritisni taster za početak'],
  ['← → kretanje · SPACE ili ↑ skok · SHIFT trčanje · M zvuk',1]
]);
let last=0,accum=0;
function loop(ts){
  const dt=Math.min(100,ts-last||16);last=ts;accum+=dt;
  let n=0;
  while(accum>=1000/60&&n<5){step();accum-=1000/60;n++;}
  if(n===5)accum=0;
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
